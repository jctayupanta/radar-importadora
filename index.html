const fmt = d => d ? d.toLocaleDateString("es-EC", { day: "numeric", month: "short", year: "numeric" }) : "—";
const fmtCorto = d => d ? d.toLocaleDateString("es-EC", { day: "numeric", month: "short" }) : "—";
const key = d => d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
const iso = s => { if (!s) return null; const [y, m, d] = String(s).slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Próxima salida de carga (1 o 15), pedir hasta = salida - 3 días, lista = salida + 60 días
function proximaSalida(desde = HOY) {
  const c = [];
  for (let i = 0; i < 3; i++) { const m = new Date(desde.getFullYear(), desde.getMonth() + i, 1); c.push(new Date(m.getFullYear(), m.getMonth(), 1), new Date(m.getFullYear(), m.getMonth(), 15)); }
  const s = c.find(d => (d - desde) / 864e5 >= 3);
  const pedir = new Date(s); pedir.setDate(pedir.getDate() - 3);
  const lista = new Date(s); lista.setDate(lista.getDate() + 60);
  return { salida: s, pedir, lista };
}
function plazo(t) {
  const lista = new Date(t.fin); lista.setDate(lista.getDate() - 21);
  let s = new Date(lista); s.setDate(s.getDate() - 60);
  s = s.getDate() >= 15 ? new Date(s.getFullYear(), s.getMonth(), 15) : new Date(s.getFullYear(), s.getMonth(), 1);
  const p = new Date(s); p.setDate(p.getDate() - 3);
  const l = new Date(s); l.setDate(l.getDate() + 60);
  return { salida: s, pedir: p, lista: l };
}

// Datos de un producto: lo cotizado por Juank manda sobre lo estimado
function vals(p) {
  const d = p.datos || {};
  return {
    costo: p.costo_cotizado ?? d.costo ?? null, costoReal: p.costo_cotizado != null,
    piezas: p.piezas_por_caja_cotizado ?? d.piezas ?? null, cbm: p.cbm_cotizado ?? d.cbm ?? null,
    precio: d.precio ?? null, pedir: d.pedir ?? null, lista: d.lista ?? null,
    paises: d.paises || {}, pz: d.puntaje || {}, falta: d.falta || [], fuentes: d.fuentes || [], alertas: d.alertas || []
  };
}

// ===== Evaluación en la app: recalcula ganancia y semáforo con el costo (estimado o cotizado) =====
const PAISES = [["CO", "Colombia"], ["EC", "Ecuador"], ["MX", "México"]];
function perdida() { const e = cfg.entrega; return e > 0 ? cfg.envio * (1 - e) / e : 0; }
// Permiso pendiente (formato nuevo datos.permiso o productos viejos marcados "Permisos")
function permiso(p) {
  const d = p.datos || {};
  if (d.permiso && d.permiso.requiere) return d.permiso.resuelto ? null : d.permiso;
  if (d.motivo_tipo === "Permisos" || (d.requiereRegistro && d.requiereRegistro.valor)) return { requiere: true, tipo: null, motivo: (d.requiereRegistro && d.requiereRegistro.motivo) || p.motivo || "", resuelto: false };
  return null;
}
const enColaPermiso = p => PROP.some(x => x.estado === "en_cola" && x.producto_id === p.id && x.propuesto_por === "Permiso resuelto");
// Dónde se muestra: "normal" (tarjeta), "compacto" (sin datos / fuera de temporada / descartado por ti), "archivado"
function tipoLista(p) {
  const d = p.datos || {};
  if (p.estado === "descartado") return "compacto";
  if (d.archivado) return "archivado";
  if (d.descarte && d.descarte.tipo) return "compacto";
  if (p.semaforo === "rojo" && p.puntaje == null && !Object.values(d.puntaje || {}).some(x => typeof x === "number")) return "compacto";
  return "normal";
}
function porQueCompacto(p) {
  const d = p.datos || {};
  if (p.estado === "descartado") return "Lo descartaste tú" + (p.nota ? ": " + p.nota : ".");
  if (d.descarte) return `${d.descarte.tipo}: ${d.descarte.texto || ""}`;
  return (d.motivo_tipo ? d.motivo_tipo + ": " : "") + (p.motivo || "Sin datos para juzgarlo.");
}
function evaluar(p) {
  const d = p.datos || {}, v = vals(p); const perm = permiso(p);
  if (tipoLista(p) === "compacto" && p.estado !== "descartado") return { sem: "gris", pts: null, decision: "Sin analizar a fondo", pasos: [porQueCompacto(p), "Si crees que vale la pena, pulsa Reanalizar."], costoMax: null, elim: [], pz: v.pz, perm, compacto: true };
  if ((p.semaforo || "gris") === "gris") return { sem: "gris", pts: null, decision: "En análisis", pasos: ["Se analiza a las 8 pm o con /analizar-cola."], costoMax: null, elim: [], pz: v.pz, perm };
  const pz = { ...v.pz }; const elim = [];
  if (p.semaforo === "rojo" && d.motivo_tipo === "Llega tarde") elim.push("Llega tarde a su temporada");
  const tea = d.temporada ? ["CO", "EC", "MX"].map(k => d.temporada[k]?.este_anio).filter(Boolean)[0] : null;
  if (tea && tea.suficientes_dias === false) elim.push(`Llega tarde a ${d.temporada.nombre || "la temporada"}: solo ${tea.dias_de_venta_hasta_fin} días de venta (mínimo 21)`);
  if (p.semaforo === "rojo" && d.motivo_tipo === "Saturado") elim.push("Saturado en Ecuador (con números de proveedores y anuncios)");
  if (p.semaforo === "rojo" && d.motivo_tipo === "Sin demanda") elim.push("Sin demanda en Colombia ni Ecuador");
  const pp = d.precio_proveedor_usd ?? null; let cpaMax = null, margen = null;
  if (v.costo != null && v.precio != null) {
    cpaMax = v.precio - v.costo - cfg.envio - perdida(); const r = cpaMax / cfg.cpa;
    pz.ganancia = r >= 3 ? 15 : r >= 2 ? 12 : r >= 1.5 ? 9 : r >= 1 ? 6 : 0;
    if (cpaMax < cfg.cpa) elim.push("No da en venta directa: el precio no cubre costo, envío, devoluciones y publicidad");
  }
  const avisos = [];
  if (v.costo != null && pp) {
    margen = (pp - v.costo) / pp;
    if (margen < 0.30) {
      if ((cfg.etapa || 1) >= 2) elim.push(`Margen como proveedor de ${Math.round(margen * 100)}% (mínimo 30%)`);
      else avisos.push(`Como proveedor en Dropi dejaría ${Math.round(margen * 100)}% de margen (mínimo 30%): sirve para venta directa, no para la etapa 2.`);
    }
  }
  const known = Object.entries(pz).filter(([k, x]) => typeof x === "number" && PZ_MAX[k]);
  const sumW = known.reduce((a, [k]) => a + PZ_MAX[k], 0);
  const pts = sumW ? Math.round(100 * known.reduce((a, [, x]) => a + x, 0) / sumW) : (p.puntaje ?? null);
  let sem = elim.length ? "rojo" : pts >= 70 ? "verde" : pts >= 50 ? "amarillo" : "rojo";
  if (v.costo == null && sem === "verde") sem = "amarillo";
  const cands = []; if (v.precio != null) cands.push(v.precio - cfg.envio - perdida() - cfg.cpa);
  if (pp && ((cfg.etapa || 1) >= 2 || !cands.length)) cands.push(pp * 0.7);
  const costoMax = cands.length ? Math.min(...cands) : null;
  const costoProveedor = pp ? pp * 0.7 : null;
  let decision, pasos;
  if (sem === "rojo") { decision = "No pedir"; pasos = [elim[0] || "El puntaje con los datos reales es bajo (" + pts + ").", "Queda en el historial. Si cambia el mercado, usa Reanalizar."]; }
  else if (v.costo == null) { decision = "Cotizar primero"; pasos = ["Cotiza en Imporfactory (calculadora o asesor) el costo puesto por unidad, con piezas por caja y CBM.", costoMax != null ? `Si el costo puesto sale en ${money(costoMax)} o menos, vale la pena.` : "Falta el precio de venta para calcular el costo máximo.", "Escribe la cotización abajo en \"Tu cotización\" y pulsa Guardar: el semáforo se recalcula."]; }
  else if (sem === "amarillo") { decision = "Testear 1 caja"; pasos = ["Pide solo 1 caja en la próxima carga para probar.", "Prueba anuncios en Meta y mide el CPA real.", "Si el CPA real queda por debajo del CPA máximo, pasa a Aprobado y pide más."]; }
  else { decision = "Pedir"; pasos = ["Agrégalo en el Armador de carga.", "Pide antes de la fecha límite: " + (v.pedir || fmtCorto(proximaSalida().pedir)) + ".", "Prepara los creativos mientras llega."]; }
  if (tea && tea.suficientes_dias !== false && tea.llega_antes_del_inicio === false && sem !== "rojo") pasos.push(`Ojo: la carga llega el ${fmtCorto(iso(tea.lista_para_vender))} y la ola arrancó ~${fmtCorto(iso(tea.inicio_esperado))} el año pasado: llegas después del inicio.`);
  if (perm && sem !== "rojo") { decision = "Confirmar permiso"; pasos = [`Confirma con el curso o el agente si de verdad necesita ${perm.tipo || "permiso"} y si se puede traer en el barco grupal.`, "Mientras tanto puedes cotizarlo igual (abajo, en Tu cotización).", "Si sí puedes traerlo, pulsa \"Sí puedo traerlo\": se hace el análisis completo esa noche. Si no, pulsa \"Descartar\"."]; }
  return { sem, pts, decision, pasos, costoMax, costoProveedor, elim, pz, cpaMax, margen, perm, avisos };
}

async function cargar() {
  cargando = true; errorMsg = "";
  try {
    const [a, b, c, d] = await Promise.all([
      db.from("productos").select("*").order("creado", { ascending: false }),
      db.from("propuestas").select("*").order("creado", { ascending: false }),
      db.from("cargas").select("*").order("creado", { ascending: false }),
      db.from("config").select("*")
    ]);
    for (const r of [a, b, c, d]) if (r.error) throw r.error;
    P = a.data; PROP = b.data; CARGAS = c.data;
    const conf = Object.fromEntries(d.data.map(r => [r.clave, r.valor]));
    if (conf.supuestos) cfg = { ...cfg, ...conf.supuestos };
    RAW_T = conf.temporadas; REPORTES = Array.isArray(conf.reporte_calidad) ? conf.reporte_calidad : [];
    if (!Array.isArray(RAW_T) || RAW_T.some(t => !t.tipo)) { RAW_T = DEFAULT_TEMP; await db.from("config").update({ valor: RAW_T }).eq("clave", "temporadas"); }
    else if (!RAW_T.some(t => t.buscar)) { RAW_T = migrarTemporadas(RAW_T); await db.from("config").update({ valor: RAW_T }).eq("clave", "temporadas"); }
    TEMP = expandir(RAW_T);
  } catch (e) { errorMsg = "No se pudieron cargar los datos: " + (e.message || e); }
  cargando = false; render();
}

function calc(p) {
  const v = vals(p); const g = id => +document.getElementById(id).value;
  const pr = g("c-precio"), c = g("c-costo"), en = g("c-env"), e = g("c-ent") / 100, cpa = g("c-cpa"), cj = g("c-caj");
  const perd = e > 0 ? en * (1 - e) / e : 0, max = pr - c - en - perd, gan = max - cpa, u = cj * v.piezas, inv = u * c, rec = gan > 0 ? Math.ceil(inv / gan) : null;
  const sc = (x, r) => u * x * gan - u * (1 - x) * c * (1 - r);
  document.getElementById("calcout").innerHTML = `<div><small>Ganancia por pedido entregado</small><b style="color:var(--${gan > 0 ? "verde" : "rojo"})">${money(gan)}</b></div><div><small>CPA máximo</small><b>${money(max)}</b></div><div><small>Inversión</small><b>${money(inv)}</b></div><div><small>Ventas para recuperar</small><b>${rec ?? "—"} u</b></div><div><small>Pesimista · 70%</small><b>${money(sc(.7, .5))}</b></div><div><small>Base · 85%</small><b>${money(sc(.85, .7))}</b></div><div><small>Optimista · 100%</small><b>${money(sc(1, 0))}</b></div>`;
}
function ganancia(p) { const v = vals(p); if (!v.costo || !v.precio) return 0; const e = cfg.entrega; return v.precio - v.costo - cfg.envio - cfg.envio * (1 - e) / e - cfg.cpa; }

    btn.disabled = false;
    if (r.error) return msg("fmsg", "No se pudo enviar: " + r.error.message, true);
    msg("fmsg", "Listo, quedó en cola. Se analiza a las 8 pm."); e.target.reset(); setTimeout(cargar, 900);
  }
  if (id === "fq") {
    const p = P.find(x => x.id === ficha); const num = x => { const s = val(x); return s === "" ? null : Number(s); };
    const r = await db.from("productos").update({ costo_cotizado: num("q-costo"), piezas_por_caja_cotizado: num("q-pz"), cbm_cotizado: num("q-cbm"), estado: val("q-est"), nota: val("q-nota") || null, actualizado: new Date().toISOString() }).eq("id", p.id);
    if (r.error) return msg("qmsg", "No se pudo guardar: " + r.error.message, true);
    msg("qmsg", "Guardado."); setTimeout(cargar, 600);
  }
  if (id === "ft") {
    const nombre = val("t-n"), inicio = val("t-i"), fin = val("t-f"); if (!nombre || !inicio || !fin) return;
    if (fin < inicio) return msg("tmsg", "La fecha de fin tiene que ser después del inicio.", true);
    const anual = document.getElementById("t-anual").checked; const buscar = leerLista(val("t-buscar"));
    const lista = [...RAW_T, anual ? { id: "t" + Date.now(), nombre, tipo: "fijo", inicio: inicio.slice(5), fin: fin.slice(5), buscar } : { id: "t" + Date.now(), nombre, tipo: "unica", inicio, fin, buscar }];
    const r = await db.from("config").update({ valor: lista }).eq("clave", "temporadas");
    if (r.error) return msg("tmsg", "No se pudo guardar: " + r.error.message, true);
    const [y, m] = inicio.split("-").map(Number); calMes = new Date(y, m - 1, 1); cargar();
  }
  if (id === "fte") {
    const buscar = leerLista(document.getElementById("te-txt").value);
    const lista = RAW_T.map(x => String(x.id) === String(verTemp) ? { ...x, buscar } : x);
    const r = await db.from("config").update({ valor: lista }).eq("clave", "temporadas");
    if (r.error) return msg("temsg", "No se pudo guardar: " + r.error.message, true);
    editTemp = false; return cargar();
  }
  if (id === "fa") {
    const supuestos = { envio: +val("a-env"), entrega: +val("a-ent") / 100, cpa: +val("a-cpa"), capital: +val("a-cap"), tope: +val("a-tope") / 100, topeSinDatos: cfg.topeSinDatos, etapa: +val("a-etapa") || 1 };
    const r = await db.from("config").update({ valor: supuestos }).eq("clave", "supuestos");
    if (r.error) return msg("amsg", "No se pudo guardar: " + r.error.message, true);
    msg("amsg", "Ajustes guardados."); cfg = { ...cfg, ...supuestos };
  }
});

const h = (location.hash || "").slice(1); if (tabs.some(t => t[0] === h)) cur = h;
render(); cargar();

</script>
